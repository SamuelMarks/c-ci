name: Self-Test Caller

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  call-reusable-workflow:
    # In a real project, this would be:
    # uses: SamuelMarks/c-ci/.github/workflows/c-cmake-ci.yml@master
    uses: ./.github/workflows/c-cmake-ci.yml
    with:
      build_type: 'Release'
      cmake_configure_flags: '-DBUILD_TESTING=ON'
      disable_env_inheritance: true
      run_valgrind: true
      # Example of passing arbitrary environment variables
      env_vars: ${{ toJson(env) }}
    env:
      # These will be correctly injected as environment variables
      GIT_CONFIG_PARAMETERS: "'init.defaultBranch=main'"
      MY_CUSTOM_VAR: "Hello World"
