name: CDD Shared CMake CI

on:
  workflow_call:
    inputs:
      build_type:
        description: 'Default CMake build type (Release, Debug, RelWithDebInfo, MinSizeRel)'
        default: 'Debug'
        type: string
      cmake_configure_flags:
        description: 'Additional CMake configuration flags (e.g. -DBUILD_TESTING=ON)'
        default: ''
        type: string
      cmake_build_flags:
        description: 'Additional CMake build flags'
        default: ''
        type: string
      project_name:
        description: 'Project name for auto test flag. Defaults to repository name.'
        default: ''
        type: string
      auto_test_flag:
        description: 'Automatically add -D<PROJECT_NAME>_TESTING=ON (derived from project_name or repo name)'
        default: true
        type: boolean
      run_valgrind:
        description: 'Run ctest with valgrind (ctest -T memcheck) on Linux runners'
        default: true
        type: boolean
      extra_apt_packages:
        description: 'Space-separated list of extra apt packages to install'
        default: ''
        type: string
      extra_brew_packages:
        description: 'Space-separated list of extra brew packages to install'
        default: ''
        type: string
      extra_winget_packages:
        description: 'Space-separated list of extra winget packages to install'
        default: ''
        type: string
      extra_cygwin_packages:
        description: 'Newline-separated list of extra cygwin packages to install'
        default: ''
        type: string
      env_vars:
        description: 'JSON object of arbitrary environment variables to set for the job'
        default: '{}'
        type: string
      disable_env_inheritance:
        description: 'Disable environment inheritance for CMake and CTest (uses cmake -E env --ignore-environ)'
        default: false
        type: boolean

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ==========================================
          # WINDOWS - MSVC Latest (2026 / 2022)
          # ==========================================
          - name: Win MSVC Latest | Shared Lib (MD) | Unicode | LTO OFF | Multi-thread | FetchContent
            os: windows-2025-vs2026
            compiler: msvc
            msvc_version: latest
            crt: MultiThreadedDLL
            charset: UNICODE
            shared: "ON"
            lto: "OFF"
            thread: "ON"
            deps: FETCHCONTENT
            rtc: "OFF"

          - name: Win MSVC Latest | Static Lib (MT) | ANSI | LTO ON | Single-thread | Vcpkg | RTC1
            os: windows-2025-vs2026
            compiler: msvc
            msvc_version: latest
            crt: MultiThreaded
            charset: ANSI
            shared: "OFF"
            lto: "ON"
            thread: "OFF"
            deps: VCPKG
            rtc: "RTC1"

          - name: Win MSVC Latest | Static Lib (MDd) | Unicode | LTO OFF | Multi-thread | System | RTCu
            os: windows-2025-vs2026
            compiler: msvc
            msvc_version: latest
            crt: MultiThreadedDebugDLL
            charset: UNICODE
            shared: "OFF"
            lto: "OFF"
            thread: "ON"
            deps: SYSTEM
            rtc: "RTCu"

          - name: Win MSVC 2022 | Shared Lib (MTd) | ANSI | LTO OFF | Single-thread | FetchContent | RTCs
            os: windows-2022
            compiler: msvc
            msvc_version: "2022"
            crt: MultiThreadedDebug
            charset: ANSI
            shared: "ON"
            lto: "OFF"
            thread: "OFF"
            deps: FETCHCONTENT
            rtc: "RTCs"

          # ==========================================
          # WINDOWS - MSVC 2005 (Legacy / Self-Hosted)
          # ==========================================
          # COMMENTED OUT: Awaiting self-hosted runner availability
          # - name: Win MSVC 2005 | Static Lib (MTd) | ANSI | LTO OFF | Multi-thread | System | RTCs
          #   os: [self-hosted, msvc2005]
          #   compiler: msvc
          #   msvc_version: 2005
          #   crt: MultiThreadedDebug
          #   charset: ANSI
          #   shared: "OFF"
          #   lto: "OFF"
          #   thread: "ON"
          #   deps: SYSTEM
          #   rtc: "RTCs"
          #   experimental: true

          # ==========================================
          # WINDOWS - MinGW & Cygwin
          # ==========================================
          - name: Win MinGW | Shared Lib | ANSI | Multi-thread | LTO OFF | System
            os: windows-2025-vs2026
            compiler: mingw
            crt: ""
            charset: ANSI
            shared: "ON"
            lto: "OFF"
            thread: "ON"
            deps: SYSTEM
            rtc: "OFF"

          - name: Win MinGW | Static Lib | Unicode | Single-thread | LTO ON | FetchContent
            os: windows-2025-vs2026
            compiler: mingw
            crt: ""
            charset: UNICODE
            shared: "OFF"
            lto: "ON"
            thread: "OFF"
            deps: FETCHCONTENT
            rtc: "OFF"

          - name: Win Cygwin | Static Lib | Unicode | Single-thread | LTO OFF | FetchContent
            os: windows-2025-vs2026
            compiler: cygwin
            crt: ""
            charset: UNICODE
            shared: "OFF"
            lto: "OFF"
            thread: "OFF"
            deps: FETCHCONTENT
            rtc: "OFF"

          # ==========================================
          # LINUX - GCC & Clang
          # ==========================================
          - name: Linux GCC | Shared Lib | Unicode | Multi-thread | LTO OFF | Vcpkg
            os: ubuntu-latest
            compiler: gcc
            crt: ""
            charset: UNICODE
            shared: "ON"
            lto: "OFF"
            thread: "ON"
            deps: VCPKG
            rtc: "OFF"

          - name: Linux GCC | Static Lib | ANSI | Single-thread | LTO ON | FetchContent
            os: ubuntu-latest
            compiler: gcc
            crt: ""
            charset: ANSI
            shared: "OFF"
            lto: "ON"
            thread: "OFF"
            deps: FETCHCONTENT
            rtc: "OFF"

          - name: Linux Clang | Static Lib | ANSI | Single-thread | LTO ON | System
            os: ubuntu-latest
            compiler: clang
            crt: ""
            charset: ANSI
            shared: "OFF"
            lto: "ON"
            thread: "OFF"
            deps: SYSTEM
            rtc: "OFF"

          - name: Linux Clang | Shared Lib | Unicode | Multi-thread | LTO OFF | Vcpkg
            os: ubuntu-latest
            compiler: clang
            crt: ""
            charset: UNICODE
            shared: "ON"
            lto: "OFF"
            thread: "ON"
            deps: VCPKG
            rtc: "OFF"

          # ==========================================
          # WEBASSEMBLY - Emscripten
          # ==========================================
          - name: WebAssembly Emscripten | Static Lib | ANSI | Multi-thread | LTO OFF | FetchContent
            os: ubuntu-latest
            compiler: emscripten
            crt: ""
            charset: ANSI
            shared: "OFF"
            lto: "OFF"
            thread: "ON"
            deps: FETCHCONTENT
            rtc: "OFF"

          # ==========================================
          # MACOS - Apple Clang
          # ==========================================
          - name: macOS Clang | Shared Lib | Unicode | Multi-thread | LTO ON | FetchContent
            os: macos-latest
            compiler: clang
            crt: ""
            charset: UNICODE
            shared: "ON"
            lto: "ON"
            thread: "ON"
            deps: FETCHCONTENT
            rtc: "OFF"

          - name: macOS Clang | Static Lib | ANSI | Single-thread | LTO OFF | System
            os: macos-latest
            compiler: clang
            crt: ""
            charset: ANSI
            shared: "OFF"
            lto: "OFF"
            thread: "OFF"
            deps: SYSTEM
            rtc: "OFF"

    timeout-minutes: 60
    steps:
      - name: Inject Custom Environment Variables
        if: inputs.env_vars != '' && inputs.env_vars != '{}'
        shell: bash
        run: |
          echo "Injecting custom environment variables..."
          # Write the JSON payload to a temporary file
          cat << 'EOF' > env_vars.json
          ${{ inputs.env_vars }}
          EOF

          # Parse the JSON and append to GITHUB_ENV
          # jq -r to strip quotes and format as KEY=VALUE
          if command -v jq >/dev/null 2>&1; then
            jq -r 'to_entries | .[] | "\(.key)=\(.value)"' env_vars.json >> "$GITHUB_ENV"
          elif command -v python3 >/dev/null 2>&1; then
            python3 -c "import json, sys; d = json.load(open('env_vars.json')); [print(f'{k}={v}') for k, v in d.items()]" >> "$GITHUB_ENV"
          elif command -v python >/dev/null 2>&1; then
            python -c "import json, sys; d = json.load(open('env_vars.json')); [print(f'{k}={v}') for k, v in d.items()]" >> "$GITHUB_ENV"
          else
            echo "Error: Neither jq nor python is available to parse env_vars JSON."
            exit 1
          fi
          rm env_vars.json

      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Cache vcpkg
        id: cache-vcpkg
        if: matrix.deps == 'VCPKG'
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/vcpkg
          key: ${{ runner.os }}-vcpkg-project0-v2

      - name: checkout vcpkg
        if: matrix.deps == 'VCPKG' && steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: "offscale/vcpkg"
          ref: project0
          path: vcpkg

      - name: Bootstrap vcpkg
        if: matrix.deps == 'VCPKG' && steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./vcpkg/bootstrap-vcpkg.bat
          else
            ./vcpkg/bootstrap-vcpkg.sh
          fi


      - name: Install Extra Winget Packages
        if: runner.os == 'Windows' && inputs.extra_winget_packages != ''
        shell: pwsh
        run: |
          $packages = "${{ inputs.extra_winget_packages }}" -split "\s+" | Where-Object { $_ }
          foreach ($pkg in $packages) {
            $check = winget list --exact --id $pkg --accept-source-agreements 2>&1 | Out-String
            if ($check -match "No installed package found" -or $LASTEXITCODE -ne 0) {
              winget install --silent --accept-package-agreements --accept-source-agreements $pkg
            }
          }

      - name: Set vcpkg environment variables
        if: matrix.deps == 'VCPKG'
        shell: bash
        run: |
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_INSTALLATION_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"

      - name: Setup Cygwin
        if: matrix.compiler == 'cygwin'
        uses: cygwin/cygwin-install-action@v6
        with:
          packages: |
            cmake
            gcc-core
            gcc-g++
            make
            dos2unix
            libssl-devel
            doxygen
            graphviz
            ${{ inputs.extra_cygwin_packages }}

      - name: Configure Cygwin bash to ignore CR
        if: matrix.compiler == 'cygwin'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "SHELLOPTS=igncr"

      - name: Install Dependencies (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            pkgs="dos2unix libsqlite3-dev ${{ inputs.extra_apt_packages }}"
            if [ "${{ inputs.run_valgrind }}" = "true" ]; then
              pkgs="$pkgs valgrind"
            fi
            to_install=""
            for pkg in $pkgs; do
              if ! dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q "ok installed"; then
                to_install="$to_install $pkg"
              fi
            done
            if [ -n "$to_install" ]; then
              sudo apt-get update && sudo apt-get install -y $to_install
            fi
          elif [ "${{ runner.os }}" = "macOS" ]; then
            pkgs="dos2unix sqlite ${{ inputs.extra_brew_packages }}"
            to_install=""
            for pkg in $pkgs; do
              if ! brew list --versions "$pkg" >/dev/null 2>&1; then
                to_install="$to_install $pkg"
              fi
            done
            if [ -n "$to_install" ]; then
              brew install $to_install
            fi
          fi

      - name: Convert Line Endings
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = "msvc" ]; then
            echo "Converting line endings to CRLF for MSVC..."
            find . -type f \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' -o -name '*.cmake' -o -name 'CMakeLists.txt' \) -exec unix2dos {} + || true
          else
            echo "Converting line endings to LF for non-MSVC..."
            if command -v dos2unix &> /dev/null; then
              find . -type f \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' -o -name '*.cmake' -o -name 'CMakeLists.txt' \) -exec dos2unix {} + || true
            else
              if [ -x "/c/cygwin/bin/dos2unix.exe" ]; then find . -type f \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' -o -name '*.cmake' -o -name 'CMakeLists.txt' \) -exec /c/cygwin/bin/dos2unix.exe {} + || true; else echo "dos2unix not found, skipping..."; fi
            fi
          fi

      - name: Setup MSVC
        if: matrix.compiler == 'msvc' && matrix.msvc_version != '2005'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Disable MSVC UI Dialogs
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: |
          Write-Host "Disabling UI dialogs for MSVC testing... (this is primarily done in code via _CrtSetReportMode)"

      - name: Setup MinGW
        if: matrix.compiler == 'mingw'
        uses: egor-tensin/setup-mingw@v3

      - name: Setup Emscripten
        if: matrix.compiler == 'emscripten'
        uses: mymindstorm/setup-emsdk@v14

      - name: Configure CMake
        shell: bash
        run: |
          cat << 'EOF' > run_configure.sh
          set -e
          CMAKE_EXTRA_ARGS=()

          # Cygwin Compiler Overrides
          if [ "${{ matrix.compiler }}" = "cygwin" ]; then
            # Ensure we use Cygwin's absolute tool paths instead of accidentally picking up MSYS or Windows native tools
            CYG_CC=$(cygpath -u "$(command -v gcc)")
            CYG_CXX=$(cygpath -u "$(command -v g++)")
            CYG_MAKE=$(cygpath -u "$(command -v make)")
            export CC="$CYG_CC"
            export CXX="$CYG_CXX"
            CMAKE_EXTRA_ARGS+=("-DCMAKE_C_COMPILER=$CYG_CC")
            CMAKE_EXTRA_ARGS+=("-DCMAKE_CXX_COMPILER=$CYG_CXX")
            CMAKE_EXTRA_ARGS+=("-DCMAKE_MAKE_PROGRAM=$CYG_MAKE")
          fi

          # Dependency Provider (VCPKG)
          if [ "${{ matrix.deps }}" = "VCPKG" ]; then
            TOOLCHAIN_FILE=""
            if [ -n "$VCPKG_INSTALLATION_ROOT" ]; then
              TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
            elif [ -n "$VCPKG_ROOT" ]; then
              TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
            fi

            if [ -n "$TOOLCHAIN_FILE" ]; then
              if [ "${{ matrix.compiler }}" = "cygwin" ] && command -v cygpath >/dev/null 2>&1; then
                TOOLCHAIN_FILE=$(cygpath -u "$TOOLCHAIN_FILE")
              fi
              CMAKE_EXTRA_ARGS+=("-DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN_FILE")
            else
              echo "Warning: VCPKG_INSTALLATION_ROOT is not set, but VCPKG is requested. CMake will rely on system path."
            fi
          fi

          # MSVC 2005 Generator (Currently commented out in matrix, but logic remains for future)
          # if [ "${{ matrix.compiler }}" = "msvc" ] && [ "${{ matrix.msvc_version }}" = "2005" ]; then
          #   CMAKE_EXTRA_ARGS+=("-G" "Visual Studio 8 2005")
          # fi

          # MinGW Generator
          if [ "${{ matrix.compiler }}" = "mingw" ]; then
            CMAKE_EXTRA_ARGS+=("-G" "MinGW Makefiles")
          fi

          # Cygwin Generator
          if [ "${{ matrix.compiler }}" = "cygwin" ]; then
            CMAKE_EXTRA_ARGS+=("-G" "Unix Makefiles")
          fi

          # MinGW & Cygwin specific flags for C99 math functions
          if [ "${{ matrix.compiler }}" = "mingw" ] || [ "${{ matrix.compiler }}" = "cygwin" ]; then
            CMAKE_EXTRA_ARGS+=("-DCMAKE_C_FLAGS_INIT=-D_GNU_SOURCE")
            CMAKE_EXTRA_ARGS+=("-DCMAKE_CXX_FLAGS_INIT=-D_GNU_SOURCE")
          fi

          # Clang Compiler Overrides (Linux)
          if [ "${{ matrix.compiler }}" = "clang" ] && [ "${{ runner.os }}" = "Linux" ]; then
            export CC=clang
            export CXX=clang++
          fi

          # Emscripten Toolchain
          if [ "${{ matrix.compiler }}" = "emscripten" ]; then
            CMAKE_EXTRA_ARGS+=("-DCMAKE_TOOLCHAIN_FILE=$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake")
          fi

          # Auto Test Flag derived from project name
          if [ "${{ inputs.auto_test_flag }}" = "true" ]; then
            PROJ_NAME="${{ inputs.project_name }}"
            if [ -z "$PROJ_NAME" ]; then
              PROJ_NAME="${GITHUB_REPOSITORY#*/}"
            fi
            # Uppercase and replace hyphens with underscores
            PROJ_NAME_UPPER=$(echo "$PROJ_NAME" | tr 'a-z' 'A-Z' | tr '-' '_')
            CMAKE_EXTRA_ARGS+=("-D${PROJ_NAME_UPPER}_BUILD_TESTING=ON" "-DBUILD_TESTING=ON")
          fi

          CMAKE_ENV_ARGS=()
          if [ "${{ inputs.disable_env_inheritance }}" = "true" ]; then
            CMAKE_ENV_ARGS+=("--ignore-environ")
            # Preserve critical paths
            CMAKE_ENV_ARGS+=("PATH=$PATH")
            if [ -n "$INCLUDE" ]; then CMAKE_ENV_ARGS+=("INCLUDE=$INCLUDE"); fi
            if [ -n "$LIB" ]; then CMAKE_ENV_ARGS+=("LIB=$LIB"); fi
            if [ -n "$LIBPATH" ]; then CMAKE_ENV_ARGS+=("LIBPATH=$LIBPATH"); fi
            if [ -n "$TEMP" ]; then CMAKE_ENV_ARGS+=("TEMP=$TEMP"); fi
            if [ -n "$TMP" ]; then CMAKE_ENV_ARGS+=("TMP=$TMP"); fi
            if [ -n "$HOME" ]; then CMAKE_ENV_ARGS+=("HOME=$HOME"); fi
          fi

          # Execute CMake
          if [ ${#CMAKE_ENV_ARGS[@]} -gt 0 ]; then
            cmake -E env "${CMAKE_ENV_ARGS[@]}" cmake -B build -S . \
              "-DCMAKE_BUILD_TYPE=${{ inputs.build_type }}" \
              "-DBUILD_SHARED_LIBS=${{ matrix.shared }}" \
              "-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=${{ matrix.lto }}" \
              "-DCDD_CHARSET=${{ matrix.charset }}" \
              "-DCDD_THREADING=${{ matrix.thread }}" \
              "-DCDD_DEPS=${{ matrix.deps }}" \
              "-DCDD_MSVC_RTC=${{ matrix.rtc }}" \
              "-DCMAKE_MSVC_RUNTIME_LIBRARY=${{ matrix.crt }}" \
              "${CMAKE_EXTRA_ARGS[@]}" ${{ inputs.cmake_configure_flags }}
          else
            cmake -B build -S . \
              "-DCMAKE_BUILD_TYPE=${{ inputs.build_type }}" \
              "-DBUILD_SHARED_LIBS=${{ matrix.shared }}" \
              "-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=${{ matrix.lto }}" \
              "-DCDD_CHARSET=${{ matrix.charset }}" \
              "-DCDD_THREADING=${{ matrix.thread }}" \
              "-DCDD_DEPS=${{ matrix.deps }}" \
              "-DCDD_MSVC_RTC=${{ matrix.rtc }}" \
              "-DCMAKE_MSVC_RUNTIME_LIBRARY=${{ matrix.crt }}" \
              "${CMAKE_EXTRA_ARGS[@]}" ${{ inputs.cmake_configure_flags }}
          fi
          EOF

          chmod +x ./run_configure.sh

          if [ "${{ matrix.compiler }}" = "cygwin" ]; then
            C:/cygwin/bin/bash.exe --login -o igncr -c 'cd "$(cygpath -u "$GITHUB_WORKSPACE")"; ./run_configure.sh'
          else
            bash ./run_configure.sh
          fi

      - name: Build
        shell: bash
        run: |
          cat << 'EOF' > run_build.sh
          set -e
          CMAKE_ENV_ARGS=()
          if [ "${{ inputs.disable_env_inheritance }}" = "true" ]; then
            CMAKE_ENV_ARGS+=("--ignore-environ")
            CMAKE_ENV_ARGS+=("PATH=$PATH")
            if [ -n "$INCLUDE" ]; then CMAKE_ENV_ARGS+=("INCLUDE=$INCLUDE"); fi
            if [ -n "$LIB" ]; then CMAKE_ENV_ARGS+=("LIB=$LIB"); fi
            if [ -n "$LIBPATH" ]; then CMAKE_ENV_ARGS+=("LIBPATH=$LIBPATH"); fi
            if [ -n "$TEMP" ]; then CMAKE_ENV_ARGS+=("TEMP=$TEMP"); fi
            if [ -n "$TMP" ]; then CMAKE_ENV_ARGS+=("TMP=$TMP"); fi
            if [ -n "$HOME" ]; then CMAKE_ENV_ARGS+=("HOME=$HOME"); fi
          fi

          if [ ${#CMAKE_ENV_ARGS[@]} -gt 0 ]; then
            cmake -E env "${CMAKE_ENV_ARGS[@]}" cmake --build build --config "${{ inputs.build_type }}" --parallel 4 ${{ inputs.cmake_build_flags }}
          else
            cmake --build build --config "${{ inputs.build_type }}" --parallel 4 ${{ inputs.cmake_build_flags }}
          fi
          EOF

          chmod +x ./run_build.sh

          if [ "${{ matrix.compiler }}" = "cygwin" ]; then
            C:/cygwin/bin/bash.exe --login -o igncr -c 'cd "$(cygpath -u "$GITHUB_WORKSPACE")"; ./run_build.sh'
          else
            bash ./run_build.sh
          fi

      - name: Run Tests
        shell: bash
        working-directory: build
        run: |
          cat << 'EOF' > run_tests.sh
          set -e
          CMAKE_ENV_ARGS=()
          if [ "${{ inputs.disable_env_inheritance }}" = "true" ]; then
            CMAKE_ENV_ARGS+=("--ignore-environ")
            CMAKE_ENV_ARGS+=("PATH=$PATH")
            if [ -n "$INCLUDE" ]; then CMAKE_ENV_ARGS+=("INCLUDE=$INCLUDE"); fi
            if [ -n "$LIB" ]; then CMAKE_ENV_ARGS+=("LIB=$LIB"); fi
            if [ -n "$LIBPATH" ]; then CMAKE_ENV_ARGS+=("LIBPATH=$LIBPATH"); fi
            if [ -n "$TEMP" ]; then CMAKE_ENV_ARGS+=("TEMP=$TEMP"); fi
            if [ -n "$TMP" ]; then CMAKE_ENV_ARGS+=("TMP=$TMP"); fi
            if [ -n "$HOME" ]; then CMAKE_ENV_ARGS+=("HOME=$HOME"); fi
          fi
          
          # Disable MSVC UI Debug Dialogs by setting environment variables commonly checked or by running a custom pre-test script if needed.
          CMAKE_ENV_ARGS+=("_NO_DEBUG_HEAP=1")

          if [ ${#CMAKE_ENV_ARGS[@]} -gt 0 ]; then
            cmake -E env "${CMAKE_ENV_ARGS[@]}" ctest -C "${{ inputs.build_type }}" --output-on-failure
          else
            ctest -C "${{ inputs.build_type }}" --output-on-failure
          fi
          EOF

          chmod +x ./run_tests.sh

          if [ "${{ matrix.compiler }}" = "cygwin" ]; then
            C:/cygwin/bin/bash.exe --login -o igncr -c 'cd "$(cygpath -u "$GITHUB_WORKSPACE/build")"; ./run_tests.sh'
          else
            bash ./run_tests.sh
          fi

      - name: Run Valgrind
        if: inputs.run_valgrind == true && runner.os == 'Linux' && runner.arch == 'X64' && matrix.compiler != 'emscripten'
        shell: bash
        working-directory: build
        run: |
          cat << 'EOF' > run_valgrind.sh
          set -e
          CMAKE_ENV_ARGS=()
          if [ "${{ inputs.disable_env_inheritance }}" = "true" ]; then
            CMAKE_ENV_ARGS+=("--ignore-environ")
            CMAKE_ENV_ARGS+=("PATH=$PATH")
            if [ -n "$INCLUDE" ]; then CMAKE_ENV_ARGS+=("INCLUDE=$INCLUDE"); fi
            if [ -n "$LIB" ]; then CMAKE_ENV_ARGS+=("LIB=$LIB"); fi
            if [ -n "$LIBPATH" ]; then CMAKE_ENV_ARGS+=("LIBPATH=$LIBPATH"); fi
            if [ -n "$TEMP" ]; then CMAKE_ENV_ARGS+=("TEMP=$TEMP"); fi
            if [ -n "$TMP" ]; then CMAKE_ENV_ARGS+=("TMP=$TMP"); fi
            if [ -n "$HOME" ]; then CMAKE_ENV_ARGS+=("HOME=$HOME"); fi
          fi
          CMAKE_ENV_ARGS+=("_NO_DEBUG_HEAP=1")

          if [ ${#CMAKE_ENV_ARGS[@]} -gt 0 ]; then
            cmake -E env "${CMAKE_ENV_ARGS[@]}" ctest -T memcheck --output-on-failure
          else
            ctest -T memcheck --output-on-failure
          fi
          EOF

          chmod +x ./run_valgrind.sh
          bash ./run_valgrind.sh
